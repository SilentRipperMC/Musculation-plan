<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>Training Plan</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --card: rgba(255,255,255,0.05);
      --card-h: rgba(255,255,255,0.09);
      --bdr: rgba(255,255,255,0.09);
      --bdr2: rgba(255,255,255,0.16);
      --t1: #f0f0ff;
      --t2: #8b8ba8;
      --t3: #52526a;
      --violet: #8B5CF6;
      --cyan: #06B6D4;
      --rose: #EC4899;
      --orange: #F97316;
      --green: #10B981;
      --yellow: #F59E0B;
      --blue: #3B82F6;
      --r: 18px;
      --r-s: 12px;
      --r-xs: 8px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
      --day-color: var(--violet);
      --day-alpha: rgba(139,92,246,0.18);
      --nav-h: 68px;
    }

    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--t1);
      min-height: 100dvh;
      overflow-x: hidden;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ── AMBIENT ── */
    .amb { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .amb-1 { position: absolute; top: -15%; left: -15%; width: 55%; height: 55%; background: radial-gradient(ellipse, rgba(139,92,246,0.09), transparent 70%); }
    .amb-2 { position: absolute; bottom: -15%; right: -10%; width: 50%; height: 50%; background: radial-gradient(ellipse, rgba(6,182,212,0.07), transparent 70%); }
    .amb-d { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); width: 70%; height: 40%; background: radial-gradient(ellipse, var(--day-alpha), transparent 70%); transition: background 0.6s ease; }

    /* ── APP ── */
    .app { position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 100dvh; }

    /* ── TOPBAR ── */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      padding: calc(var(--safe-t) + 10px) clamp(12px, 3vw, 24px) 10px;
      background: rgba(10,10,15,0.85);
      backdrop-filter: blur(24px) saturate(1.5);
      -webkit-backdrop-filter: blur(24px) saturate(1.5);
      border-bottom: 1px solid var(--bdr);
      display: flex; align-items: center; gap: 10px;
      animation: fdDown 0.4s ease both;
    }
    .top-l { flex: 1; min-width: 0; }
    .top-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--violet); background: rgba(139,92,246,0.12);
      border: 1px solid rgba(139,92,246,0.25);
      border-radius: 100px; padding: 3px 10px; margin-bottom: 2px;
    }
    .top-title {
      font-size: clamp(16px, 4vw, 22px); font-weight: 900; letter-spacing: -0.03em;
      background: linear-gradient(135deg, #fff, #c4b5fd 50%, #67e8f9);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ── LANG PILL ── */
    .lpill {
      display: flex; align-items: center;
      background: var(--card); border: 1px solid var(--bdr);
      border-radius: 100px; padding: 3px;
      backdrop-filter: blur(12px);
      flex-shrink: 0; position: relative;
    }
    .lpill-sl {
      position: absolute; top: 3px; bottom: 3px; border-radius: 100px;
      background: linear-gradient(135deg, var(--violet), var(--cyan));
      box-shadow: 0 2px 10px rgba(139,92,246,0.5);
      transition: all 0.3s cubic-bezier(0.4,0,0.2,1); z-index: 1;
    }
    .lopt {
      position: relative; z-index: 2;
      padding: 5px 10px; font-size: 11px; font-weight: 800;
      letter-spacing: 0.07em; text-transform: uppercase;
      color: var(--t3); cursor: pointer; border-radius: 100px;
      transition: color 0.25s; user-select: none;
      display: flex; align-items: center; gap: 4px;
    }
    .lopt.active { color: #fff; }
    .lfl { font-size: 13px; line-height: 1; }

    /* ── DAY STRIP ── */
    .strip-w {
      position: sticky; top: calc(var(--safe-t) + 58px); z-index: 90;
      background: rgba(10,10,15,0.75); backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--bdr);
      animation: fdDown 0.4s 0.05s ease both;
    }
    .strip {
      display: flex; overflow-x: auto; scrollbar-width: none;
      padding: 8px clamp(8px, 2vw, 16px); gap: clamp(5px, 1.2vw, 10px);
      -webkit-overflow-scrolling: touch;
    }
    .strip::-webkit-scrollbar { display: none; }

    .dchip {
      flex: 1 0 0; min-width: 48px;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: clamp(6px, 1.5vw, 10px) clamp(6px, 1.5vw, 14px);
      border: 1px solid var(--bdr); border-radius: var(--r-s);
      background: var(--card); cursor: pointer;
      transition: all 0.22s cubic-bezier(0.4,0,0.2,1);
      position: relative; -webkit-tap-highlight-color: transparent;
    }
    .dchip::after { content: ''; position: absolute; inset: 0; border-radius: var(--r-s); background: var(--day-color); opacity: 0; transition: opacity 0.22s; }
    .dchip:active { transform: scale(0.94); }
    .dchip.on { border-color: var(--day-color); box-shadow: 0 0 0 1px var(--day-color), 0 4px 16px rgba(0,0,0,0.4); }
    .dchip.on::after { opacity: 0.15; }
    .dchip-e { font-size: clamp(14px, 3.5vw, 18px); position: relative; z-index: 1; line-height: 1; }
    .dchip-s { position: relative; z-index: 1; font-size: clamp(8px, 2vw, 11px); font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--t3); transition: color 0.22s; }
    .dchip.on .dchip-s { color: var(--day-color); }
    .tdot { position: absolute; top: 4px; right: 4px; z-index: 2; width: 5px; height: 5px; border-radius: 50%; background: var(--day-color); box-shadow: 0 0 6px var(--day-color); animation: pdot 2s infinite; }
    @keyframes pdot { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.6; } }

    /* ── SCROLL AREA ── */
    .scroll {
      flex: 1; overflow-y: auto;
      padding: clamp(12px, 3vw, 24px) clamp(10px, 3vw, 24px) calc(var(--nav-h) + var(--safe-b) + 16px);
      -webkit-overflow-scrolling: touch;
    }
    .scroll::-webkit-scrollbar { width: 3px; }
    .scroll::-webkit-scrollbar-track { background: transparent; }
    .scroll::-webkit-scrollbar-thumb { background: var(--bdr); border-radius: 10px; }

    /* ── CONTENT WRAPPER — max-width grows with screen ── */
    .content { max-width: 900px; margin: 0 auto; width: 100%; }

    /* ── PANELS ── */
    .pnl { display: none; }
    .pnl.on { display: block; animation: pIn 0.35s cubic-bezier(0.4,0,0.2,1) both; }
    @keyframes pIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

    /* ── HERO ── */
    .hero {
      border-radius: var(--r); padding: clamp(16px, 4vw, 28px);
      background: var(--card); border: 1px solid var(--bdr);
      backdrop-filter: blur(12px);
      margin-bottom: clamp(12px, 3vw, 20px);
      position: relative; overflow: hidden;
    }
    .hero::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--day-color), transparent); }
    .hero-glow { position: absolute; top: -30%; right: -10%; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, var(--day-alpha) 0%, transparent 70%); pointer-events: none; }
    .hero-top { display: flex; align-items: center; gap: clamp(10px, 3vw, 18px); margin-bottom: clamp(10px, 2vw, 16px); }
    .hero-ico { width: clamp(44px, 12vw, 60px); height: clamp(44px, 12vw, 60px); flex-shrink: 0; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: clamp(22px, 6vw, 30px); background: rgba(255,255,255,0.07); border: 1px solid var(--bdr); box-shadow: 0 0 16px var(--day-alpha); }
    .hero-info { min-width: 0; }
    .hero-info h2 { font-size: clamp(18px, 5vw, 26px); font-weight: 900; letter-spacing: -0.03em; line-height: 1.1; }
    .hero-today { font-size: 11px; font-weight: 600; color: var(--day-color); display: flex; align-items: center; gap: 4px; margin-top: 2px; }
    .hero-today::before { content: ''; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--day-color); box-shadow: 0 0 6px var(--day-color); }
    .hero-muscle { font-size: clamp(11px, 3vw, 14px); font-weight: 600; color: var(--day-color); margin-top: 2px; }
    .hero-chips { display: flex; gap: 7px; flex-wrap: wrap; }
    .hero-chip { display: flex; align-items: center; gap: 5px; font-size: clamp(10px, 2.5vw, 12px); font-weight: 600; color: var(--t2); background: rgba(255,255,255,0.05); border: 1px solid var(--bdr); border-radius: 100px; padding: 4px 10px; }

    /* ── SECTION HEAD ── */
    .sec-hd { display: flex; align-items: center; gap: 8px; margin: clamp(16px, 3vw, 24px) 0 clamp(8px, 2vw, 12px); }
    .sec-ico { width: 30px; height: 30px; border-radius: 10px; background: rgba(255,255,255,0.06); border: 1px solid var(--bdr); display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
    .sec-tt { font-size: clamp(12px, 3vw, 15px); font-weight: 800; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sec-tm { font-size: 10px; font-weight: 700; color: var(--t3); background: rgba(255,255,255,0.04); border: 1px solid var(--bdr); border-radius: 100px; padding: 3px 9px; flex-shrink: 0; }

    /* ── EXERCISE CARD ── */
    .exl { display: flex; flex-direction: column; gap: 7px; }

    .exc {
      background: var(--card); border: 1px solid var(--bdr);
      border-radius: var(--r-s); padding: clamp(10px, 2.5vw, 16px);
      display: flex; align-items: center; gap: clamp(8px, 2vw, 14px);
      backdrop-filter: blur(10px); transition: all 0.2s ease;
      position: relative; overflow: hidden;
      -webkit-tap-highlight-color: transparent; cursor: default;
    }
    .exc::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--day-color); border-radius: 0 3px 3px 0; opacity: 0; transition: opacity 0.2s; }
    .exc:hover { background: var(--card-h); border-color: var(--bdr2); transform: translateX(3px); box-shadow: 0 4px 20px rgba(0,0,0,0.3), -3px 0 16px var(--day-alpha); }
    .exc:hover::before { opacity: 1; }
    .exc:active { transform: scale(0.985); background: var(--card-h); }
    .exc:active::before { opacity: 1; }

    .exc-i { width: clamp(34px, 9vw, 42px); height: clamp(34px, 9vw, 42px); flex-shrink: 0; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid var(--bdr); display: flex; align-items: center; justify-content: center; font-size: clamp(14px, 4vw, 18px); transition: all 0.2s; }
    .exc:hover .exc-i, .exc:active .exc-i { background: var(--day-alpha); border-color: var(--day-color); }

    .exc-b { flex: 1; min-width: 0; overflow: hidden; }
    .exc-n { font-size: clamp(12px, 3vw, 14px); font-weight: 700; color: var(--t1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
    .exc-t { font-size: clamp(10px, 2.3vw, 11px); color: var(--t3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* BADGES inline row */
    .exc-bgs { display: flex; gap: 4px; flex-shrink: 0; }
    .exc-bg { display: flex; flex-direction: column; align-items: center; background: rgba(255,255,255,0.05); border: 1px solid var(--bdr); border-radius: 7px; padding: clamp(3px, 0.8vw, 5px) clamp(5px, 1.5vw, 10px); min-width: clamp(32px, 9vw, 48px); }
    .exc-bg-l { font-size: clamp(7px, 1.8vw, 9px); font-weight: 700; color: var(--t3); text-transform: uppercase; letter-spacing: 0.07em; }
    .exc-bg-v { font-size: clamp(10px, 2.5vw, 13px); font-weight: 800; color: var(--day-color); line-height: 1.2; white-space: nowrap; }

    /* ── FINISHER ── */
    .fin {
      margin-top: 8px; padding: clamp(12px, 3vw, 18px);
      background: linear-gradient(135deg, rgba(249,115,22,0.13), rgba(236,72,153,0.09));
      border: 1px solid rgba(249,115,22,0.28); border-radius: var(--r-s);
      display: flex; align-items: center; gap: 12px;
    }
    .fin-ico { font-size: clamp(22px, 6vw, 28px); flex-shrink: 0; }
    .fin-bd h4 { font-size: 13px; font-weight: 800; color: #FED7AA; margin-bottom: 3px; }
    .fin-bd p { font-size: clamp(10px, 2.5vw, 12px); color: var(--t2); line-height: 1.4; }

    /* ── BOTTOM CARD ── */
    .bcard { margin-top: clamp(10px, 2.5vw, 16px); padding: clamp(14px, 3vw, 22px); background: var(--card); border: 1px solid var(--bdr); border-radius: var(--r); backdrop-filter: blur(12px); }
    .bcard-tt { font-size: clamp(11px, 2.8vw, 14px); font-weight: 800; margin-bottom: clamp(8px, 2vw, 14px); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .bcard-sub { font-size: 10px; font-weight: 500; color: var(--t3); }

    /* vascu */
    .vl { display: flex; flex-direction: column; gap: 6px; }
    .vr { display: flex; align-items: center; gap: 10px; padding: clamp(8px, 2vw, 12px); background: rgba(6,182,212,0.07); border: 1px solid rgba(6,182,212,0.18); border-radius: var(--r-xs); }
    .vr-i { font-size: 18px; flex-shrink: 0; }
    .vr-n { font-size: clamp(11px, 2.5vw, 13px); font-weight: 600; color: var(--t1); flex: 1; min-width: 0; }
    .vr-r { font-size: clamp(10px, 2.3vw, 12px); font-weight: 700; color: var(--cyan); white-space: nowrap; }

    /* rules */
    .rl { display: flex; flex-direction: column; gap: 6px; }
    .rr { display: flex; align-items: flex-start; gap: 8px; padding: clamp(7px, 1.8vw, 10px); background: rgba(245,158,11,0.07); border: 1px solid rgba(245,158,11,0.15); border-radius: var(--r-xs); }
    .rr-i { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
    .rr-t { font-size: clamp(11px, 2.5vw, 13px); color: var(--t2); font-weight: 500; line-height: 1.4; }
    .rr-t strong { color: var(--t1); font-weight: 800; }

    /* perio */
    .pl { display: flex; flex-direction: column; gap: 5px; }
    .pr { display: flex; align-items: center; gap: clamp(6px, 2vw, 12px); padding: clamp(7px, 1.8vw, 10px) clamp(8px, 2vw, 14px); background: rgba(255,255,255,0.03); border: 1px solid var(--bdr); border-radius: var(--r-xs); }
    .pr-w { font-size: clamp(10px, 2.3vw, 12px); font-weight: 800; color: var(--violet); min-width: clamp(48px, 14vw, 72px); white-space: nowrap; }
    .pr-f { font-size: clamp(10px, 2.3vw, 13px); font-weight: 500; color: var(--t2); flex: 1; min-width: 0; }
    .pr-r { font-size: clamp(9px, 2vw, 11px); font-weight: 800; padding: 3px 7px; border-radius: 100px; background: rgba(139,92,246,0.15); color: var(--violet); border: 1px solid rgba(139,92,246,0.25); white-space: nowrap; flex-shrink: 0; }
    .pr.dl .pr-r { background: rgba(16,185,129,0.15); color: var(--green); border-color: rgba(16,185,129,0.25); }

    /* ── BOTTOM NAV ── */
    .bnav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
      padding: 0 clamp(6px, 2vw, 14px) calc(var(--safe-b) + 6px);
      background: rgba(10,10,15,0.88);
      backdrop-filter: blur(28px) saturate(1.4);
      -webkit-backdrop-filter: blur(28px) saturate(1.4);
      border-top: 1px solid var(--bdr);
    }
    .bnav-in { display: flex; gap: 3px; padding-top: 6px; max-width: 600px; margin: 0 auto; }
    .nb {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: clamp(5px, 1.5vw, 8px) 2px; background: transparent; border: none;
      cursor: pointer; border-radius: var(--r-xs); transition: all 0.18s;
      position: relative; -webkit-tap-highlight-color: transparent;
    }
    .nb::before { content: ''; position: absolute; inset: 0; border-radius: var(--r-xs); background: var(--day-color); opacity: 0; transition: opacity 0.18s; }
    .nb.on::before { opacity: 0.14; }
    .nb.on { box-shadow: 0 0 0 1px var(--day-color); }
    .nb-e { position: relative; z-index: 1; font-size: clamp(16px, 4.5vw, 22px); line-height: 1; transition: transform 0.18s; }
    .nb.on .nb-e { transform: scale(1.15) translateY(-1px); }
    .nb:active .nb-e { transform: scale(0.88); }
    .nb-l { position: relative; z-index: 1; font-size: clamp(7px, 1.8vw, 9px); font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--t3); transition: color 0.18s; }
    .nb.on .nb-l { color: var(--day-color); }
    .nb-dot { position: absolute; top: 3px; right: clamp(4px, 1.5vw, 12px); z-index: 2; width: 5px; height: 5px; border-radius: 50%; background: var(--day-color); box-shadow: 0 0 5px var(--day-color); animation: pdot 2s infinite; }

    /* ── FAB ── */
    .fab {
      position: fixed; right: clamp(10px, 3vw, 20px); bottom: calc(var(--nav-h) + var(--safe-b) + 10px);
      z-index: 150; width: 38px; height: 38px; border-radius: 50%;
      background: var(--card); border: 1px solid var(--bdr2);
      backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center;
      font-size: 14px; cursor: pointer; opacity: 0; pointer-events: none;
      transform: translateY(10px); transition: all 0.25s;
      -webkit-tap-highlight-color: transparent;
    }
    .fab.vis { opacity: 1; pointer-events: all; transform: translateY(0); }
    .fab:active { transform: scale(0.88); }

    .swh { text-align: center; padding: 10px 0 0; font-size: clamp(9px, 2vw, 11px); font-weight: 500; color: var(--t3); letter-spacing: 0.05em; opacity: 0.5; }

    @keyframes fdDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

    /* ══════════════════════════════
       BREAKPOINTS — TRULY ADAPTIVE
    ══════════════════════════════ */

    /* ── ≥480 : wider phones / small tablets ── */
    @media (min-width: 480px) {
      .exc-bgs { gap: 5px; }
      .rl { display: grid; grid-template-columns: 1fr 1fr; }
      .vl { display: grid; grid-template-columns: 1fr 1fr; }
    }

    /* ── ≥680 : tablets ── */
    @media (min-width: 680px) {
      .scroll { padding-bottom: calc(var(--nav-h) + var(--safe-b) + 24px); }
      .rl { grid-template-columns: 1fr 1fr 1fr; }
      .vl { grid-template-columns: 1fr 1fr 1fr; }
      .exl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    }

    /* ── ≥900 : desktop ── */
    @media (min-width: 900px) {
      :root { --nav-h: 0px; }
      .bnav { display: none; }
      .fab { bottom: 24px; }
      .scroll { padding-bottom: 40px; }
      .strip-w { position: static; border-bottom: none; background: transparent; backdrop-filter: none; }
      .strip { max-width: 900px; margin: 0 auto; padding: 14px 24px; gap: 10px; justify-content: center; }
      .dchip { flex: 0 1 auto; min-width: 80px; padding: 10px 18px; transition: all 0.2s, transform 0.2s; }
      .dchip:hover:not(.on) { transform: translateY(-2px); background: var(--card-h); }
      .topbar { justify-content: center; }
      .top-l { flex: none; }
      .topbar { padding-left: 32px; padding-right: 32px; gap: 20px; }
      .content { max-width: 900px; }
      .exl { grid-template-columns: 1fr 1fr; gap: 10px; }
      .exc:hover { transform: translateX(4px) translateY(-1px); }
    }

    /* ── ≥1200 : large desktop ── */
    @media (min-width: 1200px) {
      .content { max-width: 1000px; }
      .exl { grid-template-columns: 1fr 1fr; gap: 12px; }
      body { background: #050508; }
      body::after { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse at center, rgba(139,92,246,0.04) 0%, transparent 70%); pointer-events: none; z-index: 0; }
    }

    /* ── ≤359 : tiny phones ── */
    @media (max-width: 359px) {
      .exc-bgs { display: none; }
      .exc-n { white-space: normal; }
      .dchip-s { font-size: 7px; }
      .lopt { padding: 4px 7px; font-size: 9px; }
    }
  </style>
</head>
<body>

<div class="amb"><div class="amb-1"></div><div class="amb-2"></div><div class="amb-d" id="ambD"></div></div>

<div class="app">

  <div class="topbar">

<div class="bcard"><div class="bcard-tt" style="color:var(--cyan)">${L.vT} <span class="bcard-sub">${L.vS}</span></div><div class="vl">${L.vascu.map(v=>`<div class="vr"><div class="vr-i">${v.i}</div><div class="vr-n">${v.n}</div><div class="vr-r">${v.r}</div></div>`).join('')}</div></div>
<div class="bcard"><div class="bcard-tt" style="color:var(--yellow)">${L.rT}</div><div class="rl">${L.rules.map(r=>`<div class="rr"><span class="rr-i">${r.i}</span><span class="rr-t"><strong>${r.b}</strong> ${r.d}</span></div>`).join('')}</div></div>
<div class="bcard"><div class="bcard-tt" style="color:var(--violet)">${L.pT}</div><div class="pl">${L.perio.map(p=>`<div class="pr${p.dl?' dl':''}"><span class="pr-w">${p.w}</span><span class="pr-f">${p.f}</span><span class="pr-r">${p.r}</span></div>`).join('')}</div></div>`;
p.appendChild(e);w.appendChild(p);});}

function go(i,scroll=true){di=i;const d=D[lang].days[i];setC(d.c,d.a);
document.querySelectorAll('.dchip').forEach((c,j)=>c.classList.toggle('on',j===i));
document.querySelectorAll('.nb').forEach((b,j)=>b.classList.toggle('on',j===i));
document.querySelectorAll('.pnl').forEach((p,j)=>{p.classList.toggle('on',j===i);if(j===i){p.style.animation='none';p.offsetHeight;p.style.animation='';}});
const ch=document.querySelectorAll('.dchip');if(ch[i])ch[i].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
if(scroll)$('scroll').scrollTo({top:0,behavior:'smooth'});}

function initLang(){const sl=$('lSl'),fr=$('oFR'),en=$('oEN'),pill=$('lPill');
function mv(l){const t=l==='fr'?fr:en,pr=pill.getBoundingClientRect(),tr=t.getBoundingClientRect();sl.style.left=(tr.left-pr.left)+'px';sl.style.width=tr.width+'px';fr.classList.toggle('active',l==='fr');en.classList.toggle('active',l==='en');}
requestAnimationFrame(()=>mv('fr'));
function sw(l){if(lang===l)return;lang=l;mv(l);document.documentElement.lang=l;
$('tBadge').textContent=D[l].badge;$('tTitle').textContent=D[l].title;$('swh').textContent=D[l].swh;
const w=$('cWrap');w.style.opacity='0';w.style.transition='opacity 0.15s';
setTimeout(()=>{bStrip();bNav();bPanels();go(di,false);w.style.opacity='1';},150);}
fr.onclick=()=>sw('fr');en.onclick=()=>sw('en');}

function initSwipe(){const a=$('scroll');let sx=0,sy=0,st=0;
a.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now();},{passive:true});
a.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy,dt=Date.now()-st;
if(dt<400&&Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5){const mx=D[lang].days.length-1;if(dx<0&&di<mx)go(di+1);if(dx>0&&di>0)go(di-1);}},{passive:true});}

function initFab(){const f=$('fab'),a=$('scroll');f.onclick=()=>a.scrollTo({top:0,behavior:'smooth'});a.addEventListener('scroll',()=>f.classList.toggle('vis',a.scrollTop>200),{passive:true});}

const id=D[lang].days[di];setC(id.c,id.a);bStrip();bNav();bPanels();initLang();initSwipe();initFab();
setTimeout(()=>{const ch=document.querySelectorAll('.dchip');if(ch[di])ch[di].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});},150);
</script>
</body>
</html>
