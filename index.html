<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>Training Plan</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --card: rgba(255,255,255,0.05); --card-h: rgba(255,255,255,0.09);
      --bdr: rgba(255,255,255,0.09); --bdr2: rgba(255,255,255,0.16);
      --t1: #f0f0ff; --t2: #8b8ba8; --t3: #52526a;
      --violet: #8B5CF6; --cyan: #06B6D4; --rose: #EC4899;
      --orange: #F97316; --green: #10B981; --yellow: #F59E0B; --blue: #3B82F6;
      --r: 18px; --r-s: 12px; --r-xs: 8px;
      --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
      --dc: var(--violet); --da: rgba(139,92,246,0.18); --nav-h: 68px;
      /* Marges augmentées pour éviter le contact avec les bords */
      --px: clamp(20px, 6vw, 40px);
    }
    html { 
      scroll-behavior: smooth; 
      -webkit-text-size-adjust: 100%; 
      /* Réserve l'espace de la scrollbar pour éviter le décalage d'alignement */
      scrollbar-gutter: stable;
    }
    body { font-family:'Inter',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--t1); min-height:100dvh; overflow-x:hidden; line-height:1.5; -webkit-font-smoothing:antialiased; }

    /* ── SVG ICON UTIL ── */
    .ico { display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
    .ico svg { width:1em; height:1em; }

    /* ── CANVAS BG ── */
    .amb { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; filter: blur(60px); }
    .amb canvas { position:absolute; inset:0; width:100%; height:100%; opacity: 0.8; }

    /* CSS Gradients removed to keep background pure black */

    /* ── APP ── */
    .app { position:relative; z-index:1; display:flex; flex-direction:column; min-height:100dvh; }

    /* ── TOPBAR ── */
    .topbar {
      position:sticky; top:0; z-index:100;
      background: rgba(10,10,15,0.75);
      backdrop-filter: blur(40px) saturate(1.8); -webkit-backdrop-filter: blur(40px) saturate(1.8);
      border-bottom: 1px solid var(--bdr);
      animation: fdDown 0.4s ease both;
    }
    .topbar-in {
      max-width: 900px;
      margin: 0 auto;
      /* Padding horizontal identique au contenu */
      padding: calc(var(--safe-t) + 20px) var(--px) 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
    }
    .top-l { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .top-badge {
      display:inline-flex; align-items:center; gap:6px;
      font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase;
      color:var(--violet); background:rgba(139,92,246,0.12);
      border:1px solid rgba(139,92,246,0.25);
      border-radius:100px; padding:3px 10px; margin-bottom:2px;
    }
    .top-badge .ico { font-size:12px; }
    .top-title {
      font-size:clamp(16px,4vw,22px); font-weight:900; letter-spacing:-0.03em;
      background: linear-gradient(135deg,#fff,#c4b5fd 50%,#67e8f9);
      background-size:200% 200%; animation: shimmer 4s ease infinite;
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    @keyframes shimmer { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

    /* ── LANG PILL ── */
    .lpill { display:flex; align-items:center; background:var(--card); border:1px solid var(--bdr); border-radius:100px; padding:3px; backdrop-filter:blur(20px); flex-shrink:0; position:relative; }
    .lpill-sl { position:absolute; top:3px; bottom:3px; border-radius:100px; background:linear-gradient(135deg,var(--violet),var(--cyan)); background-size:200% 200%; animation: shimmer 3s ease infinite; box-shadow:0 2px 10px rgba(139,92,246,0.5); transition:all 0.3s cubic-bezier(0.4,0,0.2,1); z-index:1; }
    .lopt { position:relative; z-index:2; padding:5px 10px; font-size:11px; font-weight:800; letter-spacing:0.07em; text-transform:uppercase; color:var(--t3); cursor:pointer; border-radius:100px; transition:color 0.25s; user-select:none; display:flex; align-items:center; gap:4px; }
    .lopt.active { color:#fff; }

    /* ── DAY STRIP ── */
    .strip-w { 
      position:sticky; 
      top: 68px; /* Hauteur ajustée de la topbar */
      z-index: 90; 
      background: rgba(10,10,15,0.65); 
      backdrop-filter: blur(30px); 
      -webkit-backdrop-filter: blur(30px); 
      border-bottom: 1px solid var(--bdr); 
      animation: fdDown 0.4s 0.05s ease both; 
    }
    .strip-in {
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }
    .strip { 
      display: flex; 
      overflow-x: auto; 
      scrollbar-width: none; 
      padding: 12px var(--px) 16px; 
      gap: 12px; 
      -webkit-overflow-scrolling: touch; 
    }
    .strip::-webkit-scrollbar { display:none; }
    .dchip { flex:1 0 0; min-width:48px; display:flex; flex-direction:column; align-items:center; gap:2px; padding:clamp(6px,1.5vw,10px) clamp(6px,1.5vw,14px); border:1px solid var(--bdr); border-radius:var(--r-s); background:var(--card); cursor:pointer; transition:all 0.22s cubic-bezier(0.4,0,0.2,1); position:relative; -webkit-tap-highlight-color:transparent; }
    .dchip::after { content:''; position:absolute; inset:0; border-radius:var(--r-s); background:var(--dc); opacity:0; transition:opacity 0.22s; }
    .dchip:active { transform:scale(0.94); }
    .dchip.on { border-color:var(--dc); box-shadow:0 0 0 1px var(--dc), 0 4px 16px rgba(0,0,0,0.4); }
    .dchip.on::after { opacity:0.15; }
    .dchip-e { position:relative; z-index:1; line-height:1; display:flex; align-items:center; justify-content:center; }
    .dchip-e svg { width:clamp(18px,4.5vw,24px); height:clamp(18px,4.5vw,24px); }
    .dchip-s { position:relative; z-index:1; font-size:clamp(8px,2vw,11px); font-weight:800; letter-spacing:0.06em; text-transform:uppercase; color:var(--t3); transition:color 0.22s; }
    .dchip.on .dchip-s { color:var(--dc); }
    .tdot { position:absolute; top:4px; right:4px; z-index:2; width:5px; height:5px; border-radius:50%; background:var(--dc); box-shadow:0 0 6px var(--dc); animation:pdot 2s infinite; }
    @keyframes pdot { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.5);opacity:0.6} }

    /* ── SCROLL ── */
    .scroll { 
      flex: 1; 
      overflow-y: auto; 
      padding: clamp(20px, 5vw, 40px) 0 calc(var(--nav-h) + var(--safe-b) + 24px); 
      -webkit-overflow-scrolling: touch; 
    }
    .scroll::-webkit-scrollbar { width:3px; }
    .scroll::-webkit-scrollbar-track { background:transparent; }
    .scroll::-webkit-scrollbar-thumb { background:var(--bdr); border-radius:10px; }
    
    .content { 
      max-width: 900px; 
      margin: 0 auto; 
      width: 100%; 
      /* Padding horizontal identique à la Topbar */
      padding: 0 var(--px); 
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── PANELS ── */
    .pnl { display:none; width: 100%; box-sizing: border-box; }
    .pnl.on { display:flex; flex-direction: column; gap: 12px; animation:pIn 0.35s cubic-bezier(0.4,0,0.2,1) both; }
    @keyframes pIn { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }

    /* ── HERO ── */
    .hero { border-radius:var(--r); padding:clamp(16px,4vw,28px); background:var(--card); border:1px solid var(--bdr); backdrop-filter:blur(30px); margin-bottom:clamp(12px,3vw,20px); position:relative; overflow:hidden; }
    .hero::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--dc),transparent); background-size:200% 100%; animation:borderGlow 3s ease infinite; }
    @keyframes borderGlow { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    .hero-glow { position:absolute; top:-30%; right:-10%; width:160px; height:160px; border-radius:50%; background:radial-gradient(circle,var(--da) 0%,transparent 70%); pointer-events:none; animation:orbFloat 6s ease-in-out infinite; }
    @keyframes orbFloat { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-15px,12px)} }
    .hero-top { display:flex; align-items:center; gap:clamp(10px,3vw,18px); margin-bottom:clamp(10px,2vw,16px); }
    .hero-ico { width:clamp(44px,12vw,60px); height:clamp(44px,12vw,60px); flex-shrink:0; border-radius:16px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.07); border:1px solid transparent; box-shadow:0 0 16px var(--da); position:relative; }
    .hero-ico-ring { position:absolute; inset:-2px; border-radius:18px; padding:2px; overflow:hidden; z-index:0; }
    .hero-ico-ring::before { content:''; position:absolute; inset:-50%; width:200%; height:200%; background:conic-gradient(from 0deg, var(--dc), transparent 40%, transparent 60%, var(--dc)); animation:ringRotate 4s linear infinite; }
    .hero-ico-ring::after { content:''; position:absolute; inset:2px; border-radius:16px; background:rgba(10,10,15,0.85); }
    @keyframes ringRotate { to { transform: rotate(360deg); } }
    .hero-ico svg { width:clamp(24px,7vw,32px); height:clamp(24px,7vw,32px); position:relative; z-index:1; }
    .nb-e { position:relative; z-index:1; line-height:1; display:flex; align-items:center; justify-content:center; transition:transform 0.18s; }
    .nb-e svg { width:clamp(18px,5vw,24px); height:clamp(18px,5vw,24px); }
    .hero-info { min-width:0; }
    .hero-info h2 { font-size:clamp(18px,5vw,26px); font-weight:900; letter-spacing:-0.03em; line-height:1.1; }
    .hero-today { font-size:11px; font-weight:600; color:var(--dc); display:flex; align-items:center; gap:4px; margin-top:2px; }
    .hero-today .dot-live { width:5px; height:5px; border-radius:50%; background:var(--dc); box-shadow:0 0 6px var(--dc); animation:pdot 2s infinite; }
    .hero-muscle { font-size:clamp(11px,3vw,14px); font-weight:600; color:var(--dc); margin-top:2px; }
    .hero-chips { display:flex; gap:7px; flex-wrap:wrap; }
    .hero-chip { display:flex; align-items:center; gap:5px; font-size:clamp(10px,2.5vw,12px); font-weight:600; color:var(--t2); background:rgba(255,255,255,0.05); border:1px solid var(--bdr); border-radius:100px; padding:4px 10px; }
    .hero-chip .ico { font-size:12px; color:var(--t3); }

    /* ── SECTION HEAD ── */
    .sec-hd { display:flex; align-items:center; gap:8px; margin:clamp(16px,3vw,24px) 0 clamp(8px,2vw,12px); }
    .sec-ico { width:30px; height:30px; border-radius:10px; background:rgba(255,255,255,0.06); border:1px solid var(--bdr); display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; color:var(--dc); }
    .sec-tt { font-size:clamp(12px,3vw,15px); font-weight:800; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .sec-tm { font-size:10px; font-weight:700; color:var(--t3); background:rgba(255,255,255,0.04); border:1px solid var(--bdr); border-radius:100px; padding:3px 9px; flex-shrink:0; }

    /* ── EXERCISE CARD ── */
    .exl { display:flex; flex-direction:column; gap:7px; }
    .exc { background:var(--card); border:1px solid var(--bdr); border-radius:var(--r-s); padding:clamp(10px,2.5vw,16px); display:flex; align-items:center; gap:clamp(8px,2vw,14px); backdrop-filter:blur(20px); transition:all 0.2s ease; position:relative; overflow:hidden; -webkit-tap-highlight-color:transparent; cursor:default; }
    .exc::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:linear-gradient(180deg,var(--dc),transparent); border-radius:0 3px 3px 0; opacity:0; transition:opacity 0.2s; }
    .exc:hover { background:var(--card-h); border-color:var(--bdr2); transform:translateX(3px); box-shadow:0 4px 20px rgba(0,0,0,0.3),-3px 0 16px var(--da); }
    .exc:hover::before { opacity:1; }
    .exc:active { transform:scale(0.985); background:var(--card-h); }
    .exc:active::before { opacity:1; }
    .exc-i { width:clamp(34px,9vw,42px); height:clamp(34px,9vw,42px); flex-shrink:0; border-radius:10px; background:rgba(255,255,255,0.05); border:1px solid var(--bdr); display:flex; align-items:center; justify-content:center; font-size:clamp(14px,3.5vw,16px); color:var(--dc); transition:all 0.2s; }
    .exc-i svg { width:1em; height:1em; }
    .exc:hover .exc-i,.exc:active .exc-i { background:var(--da); border-color:var(--dc); }
    .exc-b { flex:1; min-width:0; overflow:hidden; }
    .exc-n { font-size:clamp(12px,3vw,14px); font-weight:700; color:var(--t1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:2px; }
    .exc-t { font-size:clamp(10px,2.3vw,11px); color:var(--t3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:4px; }
    .exc-t .ico { font-size:10px; color:var(--yellow); }
    .exc-bgs { display:flex; gap:4px; flex-shrink:0; }
    .exc-bg { display:flex; flex-direction:column; align-items:center; background:rgba(255,255,255,0.05); border:1px solid var(--bdr); border-radius:7px; padding:clamp(3px,0.8vw,5px) clamp(5px,1.5vw,10px); min-width:clamp(32px,9vw,48px); }
    .exc-bg-l { font-size:clamp(7px,1.8vw,9px); font-weight:700; color:var(--t3); text-transform:uppercase; letter-spacing:0.07em; }
    .exc-bg-v { font-size:clamp(10px,2.5vw,13px); font-weight:800; color:var(--dc); line-height:1.2; white-space:nowrap; }

    /* ── FINISHER ── */
    .fin { margin-top:8px; padding:clamp(12px,3vw,18px); background:linear-gradient(135deg,rgba(249,115,22,0.13),rgba(236,72,153,0.09)); background-size:200% 200%; animation:meshMove 8s ease infinite; border:1px solid rgba(249,115,22,0.28); border-radius:var(--r-s); display:flex; align-items:center; gap:12px; }
    .fin-ico { flex-shrink:0; color:var(--orange); font-size:clamp(20px,5vw,24px); }
    .fin-bd h4 { font-size:13px; font-weight:800; color:#FED7AA; margin-bottom:3px; }
    .fin-bd p { font-size:clamp(10px,2.5vw,12px); color:var(--t2); line-height:1.4; }

    /* ── BOTTOM CARD ── */
    .bcard { margin-top:clamp(10px,2.5vw,16px); padding:clamp(14px,3vw,22px); background:var(--card); border:1px solid var(--bdr); border-radius:var(--r); backdrop-filter:blur(30px); position:relative; overflow:hidden; }
    .bcard::before { content:''; position:absolute; top:0; left:0; right:0; height:1px; background:linear-gradient(90deg,transparent,var(--bdr2),transparent); }
    .bcard-tt { font-size:clamp(11px,2.8vw,14px); font-weight:800; margin-bottom:clamp(8px,2vw,14px); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .bcard-tt .ico { font-size:16px; }
    .bcard-sub { font-size:10px; font-weight:500; color:var(--t3); }

    /* vascu */
    .vl { display:flex; flex-direction:column; gap:6px; }
    .vr { display:flex; align-items:center; gap:10px; padding:clamp(8px,2vw,12px); background:rgba(6,182,212,0.07); border:1px solid rgba(6,182,212,0.18); border-radius:var(--r-xs); }
    .vr-i { font-size:16px; flex-shrink:0; color:var(--cyan); }
    .vr-n { font-size:clamp(11px,2.5vw,13px); font-weight:600; color:var(--t1); flex:1; min-width:0; }
    .vr-r { font-size:clamp(10px,2.3vw,12px); font-weight:700; color:var(--cyan); white-space:nowrap; }

    /* rules */
    .rl { display:flex; flex-direction:column; gap:6px; }
    .rr { display:flex; align-items:center; gap:8px; padding:clamp(7px,1.8vw,10px); background:rgba(245,158,11,0.07); border:1px solid rgba(245,158,11,0.15); border-radius:var(--r-xs); }
    .rr-i { font-size:14px; flex-shrink:0; color:var(--yellow); }
    .rr-t { font-size:clamp(11px,2.5vw,13px); color:var(--t2); font-weight:500; line-height:1.4; }
    .rr-t strong { color:var(--t1); font-weight:800; }

    /* perio */
    .pl { display:flex; flex-direction:column; gap:5px; }
    .pr { display:flex; align-items:center; gap:clamp(6px,2vw,12px); padding:clamp(7px,1.8vw,10px) clamp(8px,2vw,14px); background:rgba(255,255,255,0.03); border:1px solid var(--bdr); border-radius:var(--r-xs); }
    .pr-w { font-size:clamp(10px,2.3vw,12px); font-weight:800; color:var(--violet); min-width:clamp(48px,14vw,72px); white-space:nowrap; }
    .pr-f { font-size:clamp(10px,2.3vw,13px); font-weight:500; color:var(--t2); flex:1; min-width:0; }
    .pr-r { font-size:clamp(9px,2vw,11px); font-weight:800; padding:3px 7px; border-radius:100px; background:rgba(139,92,246,0.15); color:var(--violet); border:1px solid rgba(139,92,246,0.25); white-space:nowrap; flex-shrink:0; }
    .pr.dl .pr-r { background:rgba(16,185,129,0.15); color:var(--green); border-color:rgba(16,185,129,0.25); }

    /* ── BOTTOM NAV ── */
    .bnav { position:fixed; bottom:0; left:0; right:0; z-index:200; padding:0 0 calc(var(--safe-b)+6px); background:rgba(10,10,15,0.88); backdrop-filter:blur(28px) saturate(1.4); -webkit-backdrop-filter:blur(28px) saturate(1.4); border-top:1px solid var(--bdr); }
    .bnav-in { display:flex; gap:3px; padding:6px var(--px) 0; max-width:900px; margin:0 auto; }
    .nb { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:clamp(5px,1.5vw,8px) 2px; background:transparent; border:none; cursor:pointer; border-radius:var(--r-xs); transition:all 0.18s; position:relative; -webkit-tap-highlight-color:transparent; }
    .nb::before { content:''; position:absolute; inset:0; border-radius:var(--r-xs); background:var(--dc); opacity:0; transition:opacity 0.18s; }
    .nb.on::before { opacity:0.14; }
    .nb.on { box-shadow:0 0 0 1px var(--dc); }
    .nb.on .nb-e { transform:scale(1.15) translateY(-1px); }
    .nb:active .nb-e { transform:scale(0.88); }
    .nb-l { position:relative; z-index:1; font-size:clamp(7px,1.8vw,9px); font-weight:800; letter-spacing:0.05em; text-transform:uppercase; color:var(--t3); transition:color 0.18s; }
    .nb.on .nb-l { color:var(--dc); }
    .nb-dot { position:absolute; top:3px; right:clamp(4px,1.5vw,12px); z-index:2; width:5px; height:5px; border-radius:50%; background:var(--dc); box-shadow:0 0 5px var(--dc); animation:pdot 2s infinite; }

    /* ── FAB ── */
    .fab { position:fixed; right:clamp(10px,3vw,20px); bottom:calc(var(--nav-h)+var(--safe-b)+10px); z-index:150; width:38px; height:38px; border-radius:50%; background:var(--card); border:1px solid var(--bdr2); backdrop-filter:blur(12px); display:flex; align-items:center; justify-content:center; cursor:pointer; opacity:0; pointer-events:none; transform:translateY(10px); transition:all 0.25s; -webkit-tap-highlight-color:transparent; color:var(--t2); }
    .fab svg { width:16px; height:16px; }
    .fab.vis { opacity:1; pointer-events:all; transform:translateY(0); }
    .fab:active { transform:scale(0.88); }

    .swh { text-align:center; padding:10px 0 0; font-size:clamp(9px,2vw,11px); font-weight:500; color:var(--t3); letter-spacing:0.05em; opacity:0.5; }

    @keyframes fdDown { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }

    /* ── BREAKPOINTS ── */
    @media (min-width:480px) { .exc-bgs{gap:5px} .rl{display:grid;grid-template-columns:1fr 1fr} .vl{display:grid;grid-template-columns:1fr 1fr} }
    @media (min-width:680px) { .scroll{padding-bottom:calc(var(--nav-h)+var(--safe-b)+24px)} .rl{grid-template-columns:1fr 1fr 1fr} .vl{grid-template-columns:1fr 1fr 1fr} .exl{display:grid;grid-template-columns:1fr 1fr;gap:8px} }

let lang='fr',di=(()=>{const d=new Date().getDay();return d===0?5:d-1})();
const $=id=>document.getElementById(id);

function hToR(h){let m=h.match(/\w\w/g).map(x=>parseInt(x,16));return{r:m[0],g:m[1],b:m[2]};}
function setC(c,a){document.documentElement.style.setProperty('--dc',c);document.documentElement.style.setProperty('--da',a);if(window.updOrbs)window.updOrbs(c);}

/* ── CANVAS BG ── */
(function(){
const cv=$('ambCanvas'),ctx=cv.getContext('2d');let W,H,orbs=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
addEventListener('resize',rs);rs();

window.updOrbs=(hex)=>{
  const base=hToR(hex);
  if(orbs.length===0){
    for(let i=0;i<12;i++)orbs.push({x:Math.random()*W,y:Math.random()*H,rx:120+Math.random()*220,ry:120+Math.random()*220,vx:(Math.random()-0.5)*2.5,vy:(Math.random()-0.5)*2.0,c:{...base},a:0.12+Math.random()*0.08,ph:Math.random()*6.28,sp:0.015+Math.random()*0.02,rot:Math.random()*6.28});
  }else{
    orbs.forEach(o=>{
      o.targetC={
        r:Math.max(0,Math.min(255,base.r+(Math.random()-0.5)*40)),
        g:Math.max(0,Math.min(255,base.g+(Math.random()-0.5)*40)),
        b:Math.max(0,Math.min(255,base.b+(Math.random()-0.5)*40))
      };
    });
  }
};

const pts=[];for(let i=0;i<35;i++)pts.push({x:Math.random()*W,y:Math.random()*H,r:0.8+Math.random()*1.8,vx:(Math.random()-0.5)*0.12,vy:(Math.random()-0.5)*0.08,a:0.08+Math.random()*0.2,ph:Math.random()*6.28,tw:0.008+Math.random()*0.025});
function draw(){
  ctx.fillStyle='#0a0a0f';ctx.fillRect(0,0,W,H);
  for(const o of orbs){
    if(o.targetC){o.c.r+=(o.targetC.r-o.c.r)*0.05;o.c.g+=(o.targetC.g-o.c.g)*0.05;o.c.b+=(o.targetC.b-o.c.b)*0.05;}
    o.ph+=o.sp;o.rot+=0.008;o.x+=o.vx+Math.sin(o.ph)*2.5;o.y+=o.vy+Math.cos(o.ph*0.8)*2.0;
    const maxR=Math.max(o.rx,o.ry)*1.5;
    if(o.x<-maxR)o.x=W+maxR;if(o.x>W+maxR)o.x=-maxR;if(o.y<-maxR)o.y=H+maxR;if(o.y>H+maxR)o.y=-maxR;
    const pulseX=o.rx*(1+Math.sin(o.ph*1.2)*0.4),pulseY=o.ry*(1+Math.cos(o.ph*0.9)*0.45);
    ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);
    const g=ctx.createRadialGradient(0,0,0,0,0,Math.max(pulseX,pulseY));
    g.addColorStop(0,`rgba(${Math.round(o.c.r)},${Math.round(o.c.g)},${Math.round(o.c.b)},${o.a})`);
    g.addColorStop(1,`rgba(${Math.round(o.c.r)},${Math.round(o.c.g)},${Math.round(o.c.b)},0)`);
    ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,pulseX,pulseY,0,0,6.28);ctx.fill();ctx.restore();
  }
  for(const p of pts){p.ph+=p.tw;p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;const a=p.a*(0.3+Math.sin(p.ph)*0.7);ctx.fillStyle=`rgba(255,255,255,${Math.max(0,a)})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill();}
  requestAnimationFrame(draw);
}draw();
})();

/* ── SET TOPBAR ICON ── */
$('tIco').innerHTML=S.dumbbell('var(--violet)');

/* ── BUILD ── */
function bStrip(){const s=$('strip');s.innerHTML='';D[lang].days.forEach((d,i)=>{const c=document.createElement('div');c.className='dchip'+(i===di?' on':'');c.style.setProperty('--dc',d.c);c.innerHTML=`${i===di?'<div class="tdot"></div>':''}<div class="dchip-e">${dIcon(i,d.c)}</div><div class="dchip-s">${d.s}</div>`;c.onclick=()=>go(i);s.appendChild(c);});}

function bNav(){const n=$('bNav');n.innerHTML='';D[lang].days.forEach((d,i)=>{const b=document.createElement('button');b.className='nb'+(i===di?' on':'');b.style.setProperty('--dc',d.c);b.innerHTML=`${i===di?'<div class="nb-dot"></div>':''}<div class="nb-e">${dIcon(i,d.c)}</div><div class="nb-l">${d.s}</div>`;b.onclick=()=>go(i);n.appendChild(b);});}

function bPanels(){const w=$('cWrap');w.innerHTML='';const L=D[lang];
L.days.forEach((d,idx)=>{const p=document.createElement('div');p.className='pnl'+(idx===di?' on':'');p.id='p'+idx;
const isT=idx===di,tot=d.sec.reduce((a,s)=>a+s.ex.length,0);
p.innerHTML=`<div class="hero" style="--dc:${d.c};--da:${d.a}"><div class="hero-glow"></div><div class="hero-top"><div class="hero-ico"><div class="hero-ico-ring"></div>${dIcon(idx,d.c)}</div><div class="hero-info"><h2>${d.l}</h2>${isT?`<div class="hero-today"><span class="dot-live"></span>${L.today}</div>`:''}<div class="hero-muscle" style="color:${d.c}">${d.m}</div></div></div><div class="hero-chips"><div class="hero-chip"><span class="ico">${S.clock(d.c)}</span>${d.d}</div><div class="hero-chip"><span class="ico">${S.list(d.c)}</span>${L.ex(tot)}</div></div></div>`;

d.sec.forEach(sec=>{const se=document.createElement('div');let h='<div class="exl">';
sec.ex.forEach(x=>{h+=`<div class="exc" style="--dc:${d.c};--da:${d.a}"><div class="exc-i">${exIcon(d.c)}</div><div class="exc-b"><div class="exc-n">${x.n}</div>${x.tip?`<div class="exc-t"><span class="ico">${S.bulb('#F59E0B')}</span>${x.tip}</div>`:''}</div><div class="exc-bgs"><div class="exc-bg"><span class="exc-bg-l">${L.S}</span><span class="exc-bg-v">${x.s}</span></div><div class="exc-bg"><span class="exc-bg-l">${L.R}</span><span class="exc-bg-v">${x.r}</span></div><div class="exc-bg"><span class="exc-bg-l">${L.Re}</span><span class="exc-bg-v">${x.re}</span></div></div></div>`;});
h+='</div>';se.innerHTML=`<div class="sec-hd"><div class="sec-ico">${secIcon(sec.t,d.c)}</div><div class="sec-tt">${sec.t}</div><div class="sec-tm">${sec.tm}</div></div>${h}`;p.appendChild(se);});

if(d.fin){const f=document.createElement('div');f.innerHTML=`<div class="fin"><div class="fin-ico">${S.flame('#F97316')}</div><div class="fin-bd"><h4>${L.finT}</h4><p>${d.fin}</p></div></div>`;p.appendChild(f);}

const e=document.createElement('div');e.innerHTML=`
<div class="bcard"><div class="bcard-tt" style="color:var(--cyan)"><span class="ico">${S.drop('var(--cyan)')}</span>${L.vT} <span class="bcard-sub">${L.vS}</span></div><div class="vl">${L.vascu.map(v=>`<div class="vr"><div class="vr-i">${S[v.ik]('var(--cyan)')}</div><div class="vr-n">${v.n}</div><div class="vr-r">${v.r}</div></div>`).join('')}</div></div>
<div class="bcard"><div class="bcard-tt" style="color:var(--yellow)"><span class="ico">${S.key('var(--yellow)')}</span>${L.rT}</div><div class="rl">${L.rules.map(r=>`<div class="rr"><span class="rr-i">${S[r.ik]('var(--yellow)')}</span><span class="rr-t"><strong>${r.b}</strong> ${r.d}</span></div>`).join('')}</div></div>
<div class="bcard"><div class="bcard-tt" style="color:var(--violet)"><span class="ico">${S.chart('var(--violet)')}</span>${L.pT}</div><div class="pl">${L.perio.map(p=>`<div class="pr${p.dl?' dl':''}"><span class="pr-w">${p.w}</span><span class="pr-f">${p.f}</span><span class="pr-r">${p.r}</span></div>`).join('')}</div></div>`;
p.appendChild(e);w.appendChild(p);});}

function go(i,scroll=true){di=i;const d=D[lang].days[i];setC(d.c,d.a);
document.querySelectorAll('.dchip').forEach((c,j)=>{c.classList.toggle('on',j===i);c.style.setProperty('--dc',D[lang].days[j].c)});
document.querySelectorAll('.nb').forEach((b,j)=>{b.classList.toggle('on',j===i);b.style.setProperty('--dc',D[lang].days[j].c)});
document.querySelectorAll('.pnl').forEach((p,j)=>{p.classList.toggle('on',j===i);if(j===i){p.style.animation='none';p.offsetHeight;p.style.animation='';}});
const ch=document.querySelectorAll('.dchip');if(ch[i])ch[i].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
if(scroll)$('scroll').scrollTo({top:0,behavior:'smooth'});}

function initLang(){const sl=$('lSl'),fr=$('oFR'),en=$('oEN'),pill=$('lPill');
function mv(l){const t=l==='fr'?fr:en,pr=pill.getBoundingClientRect(),tr=t.getBoundingClientRect();sl.style.left=(tr.left-pr.left)+'px';sl.style.width=tr.width+'px';fr.classList.toggle('active',l==='fr');en.classList.toggle('active',l==='en');}
requestAnimationFrame(()=>mv('fr'));
function sw(l){if(lang===l)return;lang=l;mv(l);document.documentElement.lang=l;
$('tBadge').textContent=D[l].badge;$('tTitle').textContent=D[l].title;
const w=$('cWrap');w.style.opacity='0';w.style.transition='opacity 0.15s';
setTimeout(()=>{bStrip();bNav();bPanels();go(di,false);w.style.opacity='1';},150);}
fr.onclick=()=>sw('fr');en.onclick=()=>sw('en');}

function initSwipe(){const a=$('scroll');let sx=0,sy=0,st=0;
a.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now();},{passive:true});
a.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy,dt=Date.now()-st;
if(dt<400&&Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5){const mx=D[lang].days.length-1;if(dx<0&&di<mx)go(di+1);if(dx>0&&di>0)go(di-1);}},{passive:true});}

function initFab(){const f=$('fab'),a=$('scroll');f.onclick=()=>a.scrollTo({top:0,behavior:'smooth'});a.addEventListener('scroll',()=>f.classList.toggle('vis',a.scrollTop>200),{passive:true});}

const id=D[lang].days[di];setC(id.c,id.a);
$('tBadge').textContent=D[lang].badge;$('tTitle').textContent=D[lang].title;$('swh').textContent=D[lang].swh;
bStrip();bNav();bPanels();initLang();initSwipe();initFab();
setTimeout(()=>{const ch=document.querySelectorAll('.dchip');if(ch[di])ch[di].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});},150);
</script>
